    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
    <script>

        let cellWidth = 90;

        const hours = [
            '6am', '7am', '8am', '9am',
            '10am', '11am', '12pm', '1pm',
            '2pm', '3pm', '4pm', '5pm',
            '6pm', '7pm', '8pm', '9pm'
        ];

        const tasks = [

            {
                name: '1.1 Financing Cost',
                project: 'Construction XYZ',
                assigned: '02:00:00',
                start: 4,
                duration: 2,
                actual: '02:02:00',
                color: 'bar-blue',
                dot: 'red'
            },

            {
                name: '1.2 Financing Cost',
                project: 'Construction XYZ',
                assigned: '03:00:00',
                start: 7,
                duration: 3,
                actual: '03:01:00',
                color: 'bar-purple',
                dot: 'blue'
            },

            {
                name: '1.3 Financing Cost',
                project: 'Construction XYZ',
                assigned: '02:00:00',
                start: 10,
                duration: 2,
                actual: 'WIP',
                color: 'bar-green',
                dot: 'yellow'
            }

        ];

        /* HEADER */

        function renderHeader() {

            const header =
                document.getElementById('timeHeader');

            header.innerHTML = '';

            hours.forEach(hour => {

                header.innerHTML += `
            <div class="time-col"
            style="
            width:${cellWidth}px;
            min-width:${cellWidth}px;
            ">
                ${hour}
            </div>
            `;

            });

        }

        /* TASKS */

        function renderTasks() {

            const rows =
                document.getElementById('rows');

            rows.innerHTML = '';

            tasks.forEach((task, index) => {

                rows.innerHTML += `

            <div class="gantt-row">

                <div class="left-fixed">
                    <div class="cell edt">                        
                        <input class="form-check-input" type="checkbox">
                    </div>                   

                    <div class="cell taskname">

                        <div class="task-flex">

                            <span class="dot ${task.dot}">
                            </span>

                            ${task.name}

                        </div>

                    </div>

                    <div class="cell taskname">
                       <b>${task.project}</b>
                    </div>
                    <div class="cell assigned">
                        ${task.assigned}
                    </div>
                </div>
                <div class="timeline-area">

                    <div class="timeline-grid">

                        <!-- SHIFT -->

                        <div class="shift-time"></div>

                        <!-- TASK -->

                        <div class="task-bar ${task.color}"
                        style="
                        left:${task.start * cellWidth}px;
                        width:${task.duration * cellWidth}px;
                        ">

                            ${task.actual}

                            <div class="resize"></div>

                        </div>

                    </div>

                </div>
                <div class="right-fixed">
                    <div class="cell actual
                    ${task.actual === 'WIP'
                        ? 'green-text'
                    : 'red-text'}">
                    <div class="timer_wrapper">
                        <div class="d-flex align-items-center gap-1">
                            <i class="bx bx-stopwatch" style="font-size:18px;"></i><span>${task.actual}</span>
                        </div>
                    </div>
                    <i class="bx bx-progress ms-2" style="font-size:18px;"></i>
                    </div>

                </div>

            </div>

            `;

            });

            updateGrid();
            dragBars();
            resizeBars();

        }

        /* UPDATE GRID */

        function updateGrid() {

            document.querySelectorAll('.timeline-grid')
                .forEach(grid => {

                    grid.style.setProperty(
                        '--cell-width',
                        cellWidth + 'px'
                    );

                    /*
                    TIMELINE START = 6AM

                    9:30AM = 3.5 cells
                    6PM    = 12 cells
                    */

                    const shiftStart =
                        3.5 * cellWidth;

                    const shiftEnd =
                        12.5 * cellWidth;

                    const shift =
                        grid.querySelector('.shift-time');

                    shift.style.left =
                        shiftStart + 'px';

                    shift.style.width =
                        (shiftEnd - shiftStart) + 'px';

                });

        }

        /* ADD TASK */

        function addTask() {

            const task = {

                id: 'TS' + Math.floor(Math.random() * 9999),

                name:
                    document.getElementById('taskName').value,

                start: Number(
                    document.getElementById('start').value
                ),

                duration: Number(
                    document.getElementById('duration').value
                ),

                assigned:
                    document.getElementById('assigned').value,

                actual: 'WIP',

                color:
                    document.getElementById('color').value,

                dot: 'blue'

            };

            tasks.push(task);

            renderTasks();

        }

        /* DRAG */

        function dragBars() {

            const bars =
                document.querySelectorAll('.task-bar');

            bars.forEach(bar => {

                let isDragging = false;

                let startX;
                let startLeft;

                bar.addEventListener('mousedown', (e) => {

                    if (
                        e.target.classList.contains('resize')
                    ) return;

                    isDragging = true;

                    startX = e.clientX;

                    startLeft =
                        parseInt(bar.style.left);

                });

                document.addEventListener('mousemove', (e) => {

                    if (!isDragging) return;

                    let dx =
                        e.clientX - startX;

                    let left =
                        startLeft + dx;

                    left =
                        Math.round(left / cellWidth)
                        * cellWidth;

                    if (left < 0) left = 0;

                    bar.style.left =
                        left + 'px';

                });

                document.addEventListener('mouseup', () => {

                    isDragging = false;

                });

            });

        }

        /* RESIZE */

        function resizeBars() {

            const handles =
                document.querySelectorAll('.resize');

            handles.forEach(handle => {

                let resizing = false;

                let startX;
                let startWidth;

                handle.addEventListener('mousedown', (e) => {

                    resizing = true;

                    startX = e.clientX;

                    startWidth = parseInt(
                        window.getComputedStyle(
                            handle.parentElement
                        ).width
                    );

                    e.stopPropagation();

                });

                document.addEventListener('mousemove', (e) => {

                    if (!resizing) return;

                    let dx =
                        e.clientX - startX;

                    let width =
                        startWidth + dx;

                    width =
                        Math.round(width / cellWidth)
                        * cellWidth;

                    if (width < cellWidth)
                        width = cellWidth;

                    handle.parentElement.style.width =
                        width + 'px';

                });

                document.addEventListener('mouseup', () => {

                    resizing = false;

                });

            });

        }

        /* ZOOM */

        function zoomIn() {

            cellWidth += 10;

            renderHeader();
            renderTasks();

        }

        function zoomOut() {

            if (cellWidth <= 50) return;

            cellWidth -= 10;

            renderHeader();
            renderTasks();

        }

        /* INIT */

        renderHeader();
        renderTasks();

    </script>
