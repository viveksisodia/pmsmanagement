    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
    <script>

        let cellWidth = 90;

        const hours = [
            '6am', '7am', '8am', '9am',
            '10am', '11am', '12pm', '1pm',
            '2pm', '3pm', '4pm', '5pm',
            '6pm', '7pm', '8pm', '9pm'
        ];

        const tasks = [

            {
                date: '18/05/2026',
                assigned: '02:00:00',
                name: '1.1 Financing Cost',
                start: 2.5,
                duration: 2,
                color: '#89afed',
                actual: '02:02:00',
            },
            {
                date: '18/05/2026',
                assigned: '04:00:00',
                name: '1.2 Taxation',
                start: 5,
                duration: 3,
                color: '#ead48f',
                actual: '01:10:00',
            },

            {
                date: '17/05/2026',
                assigned: '03:00:00',
                name: '1.3 Financing Cost',
                start: 7,
                duration: 3,
                color: '#a5cca7',
                actual: '03:01:00',
            },

            {
                date: '17/05/2026',
                assigned: '01:00:00',
                name: '1.4 Taxation',
                start: 2,
                duration: 2,
                color: '#89afed',
                actual: '01:10:00',
            },

            {
                date: '16/05/2026',
                assigned: '02:00:00',
                name: '1.5 Financing Cost',
                start: 10,
                duration: 2,
                color: '#e49091',
                actual: '03:01:00',
            },
            {
                date: '15/05/2026',
                assigned: '02:00:00',
                name: '1.1 Financing Cost',
                start: 2.5,
                duration: 2,
                color: '#89afed',
                actual: '02:02:00',
            },
            {
                date: '15/05/2026',
                assigned: '04:00:00',
                name: '1.2 Taxation',
                start: 5,
                duration: 3,
                color: '#ead48f',
                actual: '01:10:00',
            },

            {
                date: '14/05/2026',
                assigned: '03:00:00',
                name: '1.3 Financing Cost',
                start: 7,
                duration: 3,
                color: '#a5cca7',
                actual: '03:01:00',
            },

            {
                date: '14/05/2026',
                assigned: '01:00:00',
                name: '1.4 Taxation',
                start: 2,
                duration: 2,
                color: '#89afed',
                actual: '01:10:00',
            },

            {
                date: '13/05/2026',
                assigned: '02:00:00',
                name: '1.5 Financing Cost',
                start: 10,
                duration: 2,
                color: '#e49091',
                actual: '03:01:00',
            }
        ];

        /* HEADER */

        function renderHeader() {

            const header =
                document.getElementById('timeHeader');

            header.innerHTML = '';

            hours.forEach(hour => {

                header.innerHTML += `
                                <div class="time-col"
                                style="
                                width:${cellWidth}px;
                                min-width:${cellWidth}px;
                                ">
                                    ${hour}
                                </div>
                                `;

            });

        }

        /* TASKS */

        function renderTasks() {

            const rows =
                document.getElementById('rows');

            rows.innerHTML = '';

            /* GROUP TASKS BY DATE */

            const groupedTasks = {};

            tasks.forEach(task => {

                if (!groupedTasks[task.date]) {
                    groupedTasks[task.date] = [];
                }

                groupedTasks[task.date].push(task);

            });

            /* RENDER */

            Object.keys(groupedTasks).forEach(date => {

                const dayTasks = groupedTasks[date];

                rows.innerHTML += `

                                <div class="gantt-row">

                                    <div class="left-fixed tasklogleft">

                                        <div class="cell taskdatetime">

                                            <div class="task-flex">
                                                ${date}
                                            </div>

                                        </div>

                                        <div class="cell taskdatetime">
                                           <b>${dayTasks[0].assigned}</b>
                                        </div>

                                    </div>

                                    <div class="timeline-area">

                                        <div class="timeline-grid tasklog-bar">

                                            ${dayTasks.map(task => `

                                                <div class="task-bar"
                                                style="
                                                left:${task.start * cellWidth}px;
                                                width:${task.duration * cellWidth}px;background:${task.color};"
                                                data-bs-toggle="tooltip"
                                                title="${task.name}">
                                                    ${task.name}
                                                </div>

                                            `).join('')}

                                        </div>

                                    </div>

                                    <div class="right-fixed tasklogright">

                                        <div class="cell taskdatetime">
                                            ${dayTasks[0].actual}
                                        </div>

                                    </div>

                                </div>

                                `;

            });

            updateGrid();
            dragBars();
            resizeBars();

        }

        /* INIT */

        renderHeader();
        renderTasks();

    </script>
    <!-- jQuery -->


    <script>
        $(function () {
            $('#daterange').daterangepicker({
                startDate: moment(),
                endDate: moment(),
                ranges: {
                    "Today": [moment(), moment()],
                    "Yesterday": [moment().subtract(1, 'days'), moment().subtract(1, 'days')],
                    "Last 7 Days": [moment().subtract(6, 'days'), moment()],
                    "Last 30 Days": [moment().subtract(29, 'days'), moment()],
                    "This Month": [moment().startOf('month'), moment().endOf('month')],
                    "Last Month": [
                        moment().subtract(1, 'month').startOf('month'),
                        moment().subtract(1, 'month').endOf('month')
                    ]
                },
                locale: {
                    format: 'DD/MM/YYYY'
                }
            });
        });
    </script>
</body>
