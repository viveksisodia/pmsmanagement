    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
    <script>

        // =========================
        // TASK DATA
        // =========================

        const tasks = {

            "2026-05-11": [

                {
                    tdbg: "#ffc300",
                    name: "Financing cost",
                    project: "Construction XYZ",
                    assignhrs:"02:30:00",
                    status: "success",
                    color: "danger"
                },

                {
                    tdbg: "#3978de",
                    name: "Engineering cost",
                    project: "Construction XYZ",
                    assignhrs: "02:30:00",
                    status: "warning",
                    color: "primary"
                },

                {
                    tdbg: "#ff2b2f",
                    name: "Other Task",
                    project: "Construction XYZ",
                    assignhrs: "02:30:00",
                    status: "success",
                    color: "warning"
                }

            ]

        };

        // =========================
        // EVENTS
        // =========================

        const events = [];

        for (let day = 1; day <= 30; day++) {

            events.push({

                title: "5 Tasks",

                start: `2026-05-${String(day).padStart(2, '0')}`,

                className: "calendar-event",

                extendedProps: {

                    assigned: "08:00:00",
                    actual: "07:30:00"

                }

            });

        }

        // =========================
        // INIT CALENDAR
        // =========================

        document.addEventListener('DOMContentLoaded', function () {

            const calendarEl = document.getElementById('calendar');

            const calendar = new FullCalendar.Calendar(calendarEl, {

                // MONTH VIEW ONLY
                initialView: 'dayGridMonth',

                initialDate: '2026-05-01',

                height: 'auto',

                fixedWeekCount: true,

                showNonCurrentDates: true,

                // HIDE INTERNAL HEADER
                headerToolbar: false,

                events: events,

                // CUSTOM EVENT DESIGN
                eventContent: function (arg) {

                    return {

                        html: `

                            <div>

                                <div class="event-title">
                                    ${arg.event.title}
                                </div>

                                <div class="event-time">
                                    Assigned Time: ${arg.event.extendedProps.assigned}
                                </div>

                                <div class="event-hours">
                                    Actual Hrs: ${arg.event.extendedProps.actual}
                                </div>

                            </div>

                        `
                    };
                },

                // UPDATE TITLE
                datesSet: function (info) {

                    document.getElementById('calendarTitle')
                        .innerText = info.view.title;

                },

                // DATE CLICK
                dateClick: function (info) {

                    loadTasks(info.dateStr);

                }

            });

            calendar.render();

            // DEFAULT TASK LOAD
            loadTasks('2026-05-11');

            // =========================
            // EXTERNAL CONTROLS
            // =========================

            document.getElementById('prevBtn')
                .addEventListener('click', function () {

                    calendar.prev();

                });

            document.getElementById('nextBtn')
                .addEventListener('click', function () {

                    calendar.next();

                });


        });

        // =========================
        // LOAD TASK TABLE
        // =========================

        function loadTasks(date) {

            const tbody = document.getElementById('taskTableBody');

            const dateText = new Date(date).toLocaleDateString('en-GB', {

                day: 'numeric',
                month: 'long',
                year: 'numeric'

            });

            document.getElementById('selectedDate')
                .innerText = dateText;

            tbody.innerHTML = '';

            const selectedTasks = tasks[date] || [];

            if (selectedTasks.length === 0) {

                tbody.innerHTML = `

                    <tr>

                        <td colspan="4"
                            class="text-center py-5 text-muted">

                            No Tasks Available

                        </td>

                    </tr>

                `;

                return;
            }

            selectedTasks.forEach((task, index) => {

                tbody.innerHTML += `

                    <tr>

                        <td class="color_border" style="border-left-color:${task.tdbg} !important;">

                            <span class="task-dot bg-${task.color}"></span>

                            ${task.name}

                        </td>

                        <td>${task.project}</td>
                        <td>${task.assignhrs}</td>

                        <td>

                            <div class="status-icon status-${task.status}">

                                ${
                    task.status === 'success'
                        ? '<i class="las la-check-circle"></i>'
                        : '<i class="las la-history"></i>'
                    }

                            </div>

                        </td>

                    </tr>

                `;
            });

        }

    </script>
