    <script>
        var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'))
        var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
            return new bootstrap.Tooltip(tooltipTriggerEl)
        })
    </script>
    <script>

        /* =========================
           CONFIG (ADD MONTHS HERE)
        ========================= */

        const DAY_WIDTH = 24;

        const months = [
            { name: "March 2026", days: 31 },
            { name: "April 2026", days: 30 }
        ];

        const tasks = [
            {
                task: "1 Milestone",
                level: 0,
                avatars: [1, 2, 3],
                status: "Open",
                statusClass: "gnt-tpeach",
                progress: 85,
                start: 2,
                duration: 35,
                color: "gnt-peach"
            },
            {
                task: " 1.1 Task",
                level: 1,
                avatar: 4,
                status: "Completed",
                statusClass: "gnt-tgreen",
                progress: 100,
                start: 4,
                duration: 20,
                color: "gnt-green"
            },
            {
                task: "1.1.1 Subtask",
                level: 2,
                avatar: 5,
                status: "Yet to be start",
                statusClass: "gnt-tblue",
                progress: 40,
                start: 12,
                duration: 20,
                color: "gnt-blue"
            },
            {
                task: "1.1.2 Subtask",
                level: 2,
                avatar: 5,
                status: "In progress",
                statusClass: "gnt-tyellow",
                progress: 20,
                start: 5,
                duration: 25,
                color: "gnt-yellow"
            },
            {
                task: "1.1.3 Subtask",
                level: 2,
                avatar: 5,
                status: "Reopen",
                statusClass: "gnt-tpurple",
                progress: 10,
                start: 18,
                duration: 15,
                color: "gnt-purple"
            },
            {
                task: "2 Milestone",
                level: 0,
                avatars: [1, 2, 3],
                status: "Open",
                statusClass: "gnt-tpeach",
                progress: 85,
                start: 2,
                duration: 35,
                color: "gnt-peach"
            },
            {
                task: " 2.1 Task",
                level: 1,
                avatar: 4,
                status: "Completed",
                statusClass: "gnt-tgreen",
                progress: 100,
                start: 4,
                duration: 20,
                color: "gnt-green"
            },
            {
                task: "2.1.1 Subtask",
                level: 2,
                avatar: 5,
                status: "Yet to be start",
                statusClass: "gnt-tblue",
                progress: 40,
                start: 10,
                duration: 20,
                color: "gnt-blue"
            },
            {
                task: "2.1.2 Subtask",
                level: 2,
                avatar: 5,
                status: "In progress",
                statusClass: "gnt-tyellow",
                progress: 20,
                start: 5,
                duration: 25,
                color: "gnt-yellow"
            }
        ];

        /* =========================
           TOTAL CALCULATION
        ========================= */

        const totalDays = months.reduce((a, b) => a + b.days, 0);
        const totalWidth = totalDays * DAY_WIDTH;

        /* =========================
           MONTH HEADER
        ========================= */

        const monthEl = document.querySelector(".gnt-months");

        months.forEach(m => {
            const div = document.createElement("div");
            div.className = "gnt-month";
            div.style.width = (m.days * DAY_WIDTH) + "px";
            div.innerText = m.name;
            monthEl.appendChild(div);
        });

        /* =========================
           DAYS
        ========================= */

        const daysEl = document.getElementById("days");
        daysEl.style.gridTemplateColumns = `repeat(${totalDays}, ${DAY_WIDTH}px)`;

        months.forEach(m => {
            for (let i = 1; i <= m.days; i++) {
                const s = document.createElement("span");
                s.innerText = String(i).padStart(2, "0");
                daysEl.appendChild(s);
            }
        });

        /* =========================
           SET WIDTHS
        ========================= */

        document.querySelector(".gnt-tl-head").style.width = totalWidth + "px";

        /* =========================
           TASKS
        ========================= */

        const leftRows = document.getElementById("leftRows");
        const timelineRows = document.getElementById("timelineRows");

        tasks.forEach(t => {

            /* LEFT */
            const row = document.createElement("div");
            row.className = "gnt-left-row";

            const avatars = t.avatars
                ? t.avatars.map(i => `<img src="https://i.pravatar.cc/40?img=${i}" style="width:28px;height:28px;border-radius:50%;margin-left:-6px;">`).join("")
                : `<img src="https://i.pravatar.cc/40?img=${t.avatar}" style="width:28px;height:28px;border-radius:50%;margin-left:-6px;">`;

            row.innerHTML = `
            <div style="padding-left:${t.level * 20}px">${t.task}</div>
            <div style="display:flex">${avatars}</div>
            <div class="${t.statusClass}">${t.status}</div>
            <div>
                <div class="gnt-pbox">
                    <div class="gnt-pct">${t.progress}%</div>

                    <div class="gnt-pbar">
                        <div class="gnt-pfill"
                        style="width:${t.progress}%;
                        background:${t.progress === 100 ? '#00c12b' : '#f3b400'};">
                        </div>
                    </div>
                </div>
            </div>
            <!--<div>${t.progress}%</div>-->
        `;

            leftRows.appendChild(row);

            /* RIGHT */
            const tr = document.createElement("div");
            tr.className = "gnt-tl-row";
            tr.style.width = totalWidth + "px";

            tr.innerHTML = `
            <div class="gnt-tl">
                <div class="gnt-bar ${t.color}"
                    style="left:${(t.start - 1) * DAY_WIDTH}px;
                    width:${t.duration * DAY_WIDTH}px;">
                    ${t.duration} days
                </div>
            </div>
        `;

            timelineRows.appendChild(tr);
        });

    </script>
